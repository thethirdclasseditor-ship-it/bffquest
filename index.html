<!DOCTYPE html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#060914" />
    <title>BFFquest — Better Friends. Bigger Moments.</title>
    <meta
      name="description"
      content="Create fun friendship quizzes, Ask Me Anything inboxes, Guess My Side, Two Truths & One Lie, Blind Ranking, Would You Rather, and Daily Quests on BFFquest!"
    />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="BFFquest — Friendship Quiz & Social Games" />
    <meta
      property="og:description"
      content="Better Friends. Bigger Moments. Play 8 interactive friendship games in English & Bangla!"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <!-- Monetag Ad Scripts (Cloudflare Rocket Loader Safe) -->

  </head>
  <body>
 <!-- Liquid Glass Vector Art & Gradient Definitions -->
    <svg width="0" height="0" style="position: absolute" aria-hidden="true">
      <defs>
        <!-- Original Core Gradients (Enhanced for Richer Depth) -->
        <linearGradient id="gv" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="#E2D6FF" />
          <stop offset="45%" stop-color="#A78BFA" />
          <stop offset="100%" stop-color="#3B82F6" />
        </linearGradient>
        <linearGradient id="gp" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="#F5D0FE" />
          <stop offset="45%" stop-color="#D58BF5" />
          <stop offset="100%" stop-color="#6D28D9" />
        </linearGradient>
        <linearGradient id="gw" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="#FEF08A" />
          <stop offset="48%" stop-color="#F59E0B" />
          <stop offset="100%" stop-color="#EC4899" />
        </linearGradient>
        <linearGradient id="gc" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="#A5F3FC" />
          <stop offset="45%" stop-color="#38BDF8" />
          <stop offset="100%" stop-color="#10B981" />
        </linearGradient>
        <radialGradient id="go" cx=".32" cy=".28" r=".8">
          <stop offset="0%" stop-color="#ffffff" />
          <stop offset="32%" stop-color="#C9B8FF" />
          <stop offset="100%" stop-color="#6D4FD8" />
        </radialGradient>
        <radialGradient id="gl" cx=".5" cy=".5" r=".5">
          <stop offset="0%" stop-color="#8B5CF6" stop-opacity=".55" />
          <stop offset="55%" stop-color="#38BDF8" stop-opacity=".22" />
          <stop offset="100%" stop-color="#7C5CFA" stop-opacity="0" />
        </radialGradient>

        <!-- 3D Frosted Glass Squircle Pedestal Gradients -->
        <linearGradient id="g-tile" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="#ffffff" stop-opacity="0.28" />
          <stop offset="50%" stop-color="#c9b8ff" stop-opacity="0.1" />
          <stop offset="100%" stop-color="#4fd1e8" stop-opacity="0.18" />
        </linearGradient>
        <linearGradient id="g-rim" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="#ffffff" stop-opacity="0.75" />
          <stop offset="50%" stop-color="#c9b8ff" stop-opacity="0.3" />
          <stop offset="100%" stop-color="#ffffff" stop-opacity="0.15" />
        </linearGradient>

        <!-- 1. Coffee -->
        <symbol id="coffee" viewBox="0 0 64 64">
          <rect x="4" y="4" width="56" height="56" rx="18" fill="url(#g-tile)" stroke="url(#g-rim)" stroke-width="1.4" />
          <ellipse cx="32" cy="11" rx="18" ry="4" fill="#ffffff" fill-opacity="0.18" />
          <path d="M14 26h28v12a13 13 0 0 1-13 13h-2a13 13 0 0 1-13-13z" fill="url(#gw)" />
          <path d="M42 29h3.5a5.5 5.5 0 0 1 0 11H42" fill="none" stroke="url(#gw)" stroke-width="3.6" stroke-linecap="round" />
          <path d="M23 13c-2.5 3.5 2.5 5.5 0 9.5M33 13c-2.5 3.5 2.5 5.5 0 9.5" stroke="url(#gc)" stroke-width="2.8" fill="none" stroke-linecap="round">
            <animate attributeName="opacity" values="0.45;0.95;0.45" dur="3.2s" repeatCount="indefinite" />
          </path>
          <rect x="17" y="29" width="12" height="3.5" rx="1.75" fill="#ffffff" fill-opacity="0.55" />
        </symbol>

        <!-- 2. Tea -->
        <symbol id="tea" viewBox="0 0 64 64">
          <rect x="4" y="4" width="56" height="56" rx="18" fill="url(#g-tile)" stroke="url(#g-rim)" stroke-width="1.4" />
          <ellipse cx="32" cy="11" rx="18" ry="4" fill="#ffffff" fill-opacity="0.18" />
          <path d="M12 31h40v2a15 15 0 0 1-15 15H27a15 15 0 0 1-15-15z" fill="url(#gv)" />
          <path d="M32 10c9.5 3.5 11 12.5 0 17-11-4.5-9.5-13.5 0-17z" fill="url(#gc)">
            <animateTransform attributeName="transform" type="rotate" values="-3 32 18;3 32 18;-3 32 18" dur="4s" repeatCount="indefinite" />
          </path>
          <path d="M32 13v11" stroke="#ffffff" stroke-opacity="0.75" stroke-width="2" stroke-linecap="round" />
          <rect x="18" y="51" width="28" height="3.5" rx="1.75" fill="url(#gv)" opacity="0.65" />
        </symbol>

        <!-- 3. Sun -->
        <symbol id="sun" viewBox="0 0 64 64">
          <rect x="4" y="4" width="56" height="56" rx="18" fill="url(#g-tile)" stroke="url(#g-rim)" stroke-width="1.4" />
          <circle cx="32" cy="32" r="13.5" fill="url(#gw)" />
          <ellipse cx="28" cy="26" rx="5" ry="2.5" fill="#ffffff" fill-opacity="0.6" transform="rotate(-22 28 26)" />
          <g stroke="url(#gw)" stroke-width="3.4" stroke-linecap="round">
            <path d="M32 10v4.5M32 49.5V54M10 32h4.5M49.5 32H54M16.5 16.5l3.2 3.2M44.3 44.3l3.2 3.2M47.5 16.5l-3.2 3.2M19.7 44.3l-3.2 3.2" />
            <animateTransform attributeName="transform" type="rotate" from="0 32 32" to="360 32 32" dur="28s" repeatCount="indefinite" />
          </g>
        </symbol>

        <!-- 4. Moon -->
        <symbol id="moon" viewBox="0 0 64 64">
          <rect x="4" y="4" width="56" height="56" rx="18" fill="url(#g-tile)" stroke="url(#g-rim)" stroke-width="1.4" />
          <path d="M37 13a19 19 0 1 0 14 30 15.5 15.5 0 0 1-14-30z" fill="url(#gv)" />
          <circle cx="46" cy="18" r="2.8" fill="url(#gw)">
            <animate attributeName="opacity" values="0.4;1;0.4" dur="2.8s" repeatCount="indefinite" />
          </circle>
          <circle cx="52" cy="28" r="1.8" fill="url(#gc)">
            <animate attributeName="opacity" values="1;0.35;1" dur="3.4s" repeatCount="indefinite" />
          </circle>
        </symbol>

        <!-- 5. Mountain -->
        <symbol id="mount" viewBox="0 0 64 64">
          <rect x="4" y="4" width="56" height="56" rx="18" fill="url(#g-tile)" stroke="url(#g-rim)" stroke-width="1.4" />
          <circle cx="46" cy="18" r="5.5" fill="url(#gw)" />
          <path d="M10 49L26 21l11 18 7-11 10 21H10z" fill="url(#gv)" />
          <path d="M26 21l5.5 9.5L26 28l-5.5 2.5L26 21z" fill="#ffffff" fill-opacity="0.85" />
        </symbol>

        <!-- 6. Flame (Daily Quest) -->
        <symbol id="flame" viewBox="0 0 64 64">
          <rect x="4" y="4" width="56" height="56" rx="18" fill="url(#g-tile)" stroke="url(#g-rim)" stroke-width="1.4" />
          <path d="M32 9c3.5 10.5 15.5 14 15.5 29.5a15.5 15.5 0 0 1-31 0c0-7.8 4.3-11.2 7.8-15.5 0 6 3.4 7.8 5.2 7.8-2.6-7.8-2.6-14.7 2.5-21.8z" fill="url(#gw)" />
          <path d="M32 31c2.6 5.2 7 7 7 13a7 7 0 0 1-14 0c0-3.5 2.6-5.2 3.5-7.8.9 2.6 2.6 3.5 3.5 3.5z" fill="#ffffff" fill-opacity="0.78">
            <animate attributeName="opacity" values="0.65;0.95;0.65" dur="2.2s" repeatCount="indefinite" />
          </path>
        </symbol>

        <!-- 7. Badge -->
        <symbol id="badge" viewBox="0 0 64 64">
          <rect x="4" y="4" width="56" height="56" rx="18" fill="url(#g-tile)" stroke="url(#g-rim)" stroke-width="1.4" />
          <path d="M32 10l18 6.5v14.8c0 12.2-7.4 21.2-18 24.5-10.6-3.3-18-12.3-18-24.5V16.5z" fill="url(#gv)" />
          <path d="m24 32 5.5 5.5 11-12.5" stroke="#ffffff" stroke-width="4.2" fill="none" stroke-linecap="round" stroke-linejoin="round" />
        </symbol>

        <!-- 8. Bubble (AMA & Quiz) -->
        <symbol id="bubble" viewBox="0 0 64 64">
          <rect x="4" y="4" width="56" height="56" rx="18" fill="url(#g-tile)" stroke="url(#g-rim)" stroke-width="1.4" />
          <path d="M12 20a9 9 0 0 1 9-9h22a9 9 0 0 1 9 9v16a9 9 0 0 1-9 9H29l-11 9v-9a9 9 0 0 1-6-9z" fill="url(#gv)" />
          <circle cx="24" cy="28" r="3" fill="#ffffff">
            <animate attributeName="opacity" values="0.45;1;0.45" dur="1.8s" begin="0s" repeatCount="indefinite" />
          </circle>
          <circle cx="32" cy="28" r="3" fill="#ffffff">
            <animate attributeName="opacity" values="0.45;1;0.45" dur="1.8s" begin="0.3s" repeatCount="indefinite" />
          </circle>
          <circle cx="40" cy="28" r="3" fill="#ffffff">
            <animate attributeName="opacity" values="0.45;1;0.45" dur="1.8s" begin="0.6s" repeatCount="indefinite" />
          </circle>
        </symbol>

        <!-- 9. Mask (Two Truths & One Lie) -->
        <symbol id="mask" viewBox="0 0 64 64">
          <rect x="4" y="4" width="56" height="56" rx="18" fill="url(#g-tile)" stroke="url(#g-rim)" stroke-width="1.4" />
          <path d="M12 20c11.5-6.5 28.5-6.5 40 0v11.5c0 12.5-9.2 21.5-20 21.5s-20-9-20-21.5z" fill="url(#gp)" />
          <ellipse cx="24" cy="31" rx="4.8" ry="3.6" fill="#0A1020" />
          <ellipse cx="40" cy="31" rx="4.8" ry="3.6" fill="#0A1020" />
          <path d="M26 42q6 3.5 12 0" stroke="#ffffff" stroke-opacity="0.85" stroke-width="2.8" fill="none" stroke-linecap="round" />
        </symbol>

        <!-- 10. Spark (Wrapped & Blind Ranking) -->
        <symbol id="spark" viewBox="0 0 64 64">
          <rect x="4" y="4" width="56" height="56" rx="18" fill="url(#g-tile)" stroke="url(#g-rim)" stroke-width="1.4" />
          <path d="M31 10c1.8 12.5 5.8 16.5 17.5 18.2-11.7 1.7-15.7 5.7-17.5 18.2-1.8-12.5-5.8-16.5-17.5-18.2 11.7-1.7 15.7-5.7 17.5-18.2z" fill="url(#gp)">
            <animateTransform attributeName="transform" type="scale" values="1;1.06;1" additive="sum" dur="3.2s" repeatCount="indefinite" />
          </path>
          <circle cx="48" cy="17" r="3.2" fill="url(#gw)" />
          <circle cx="49" cy="47" r="3.5" fill="url(#gc)" />
        </symbol>

        <!-- 11. Friend Node Avatar Silhouette -->
        <symbol id="pp" viewBox="0 0 32 32">
          <circle cx="16" cy="12" r="5.8" fill="#ffffff" fill-opacity="0.95" />
          <path d="M5.5 28.5a10.5 8.5 0 0 1 21 0z" fill="#ffffff" fill-opacity="0.95" />
        </symbol>

        <!-- 12. Hero Constellation Orbit Art (Visible in Both Dark & Light Mode) -->
        <symbol id="hero2" viewBox="0 0 420 440">
          <circle cx="210" cy="220" r="180" fill="url(#gl)" />
          <circle cx="210" cy="220" r="196" fill="none" stroke="url(#gv)" stroke-opacity="0.28" stroke-width="1.4" />
          <circle cx="210" cy="220" r="140" fill="none" stroke="url(#gp)" stroke-opacity="0.32" stroke-width="1.4" stroke-dasharray="6 8" />
          <ellipse
            cx="210"
            cy="220"
            rx="200"
            ry="78"
            transform="rotate(-24 210 220)"
            fill="none"
            stroke="url(#gv)"
            stroke-opacity="0.65"
            stroke-width="2"
          />
          <g
            stroke="url(#gv)"
            stroke-opacity="0.45"
            stroke-width="1.8"
            stroke-dasharray="3 7"
            stroke-linecap="round"
          >
            <path d="M92 136 165 192M330 126 262 186M360 300 272 254M92 316 158 266M210 72v62" />
          </g>
          <g stroke="#ffffff" stroke-opacity="0.65" stroke-width="1.5">
            <g transform="translate(70 120)">
              <circle r="28" fill="url(#gv)" />
              <use href="#pp" x="-16" y="-16" width="32" height="32" />
            </g>
            <g transform="translate(352 108)">
              <circle r="28" fill="url(#gp)" />
              <use href="#pp" x="-16" y="-16" width="32" height="32" />
            </g>
            <g transform="translate(382 312)">
              <circle r="28" fill="url(#gc)" />
              <use href="#pp" x="-16" y="-16" width="32" height="32" />
            </g>
            <g transform="translate(68 332)">
              <circle r="28" fill="url(#gw)" />
              <use href="#pp" x="-16" y="-16" width="32" height="32" />
            </g>
            <g transform="translate(210 44)">
              <circle r="28" fill="url(#gv)" />
              <use href="#pp" x="-16" y="-16" width="32" height="32" />
            </g>
          </g>
        </symbol>
      </defs>
    </svg>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
